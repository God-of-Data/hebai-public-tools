# #93-N(b): probe HPLT 2.0 cleaned Hebrew (schema, counts, date range only; no content written). Manual only.
name: HPLT probe
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q huggingface_hub pyarrow
      - run: python hplt_probe.py
