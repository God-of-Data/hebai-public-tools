# Re-run of the human FineWeb-2 pool that also keeps every candidate page's FULL raw text (owner, 2026-10-15:
# "save the raw data"), so passages can be re-cut locally with new rules. Same parameters as the original pool
# (8 parts, 15 row groups per file, host cap 40, 20,000 passages per part). Output is age-encrypted and attached to
# the release "fineweb-raw"; nothing readable is stored. Manual only.
name: FineWeb raw pages

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install huggingface_hub pyarrow fsspec pyrage
      - run: python fineweb_raw_pages.py --part ${{ matrix.part }} --parts 8 --rg-per-file 15 --host-cap 40 --max-keep 20000 --max-minutes 300
      - name: Upload encrypted files to the release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view fineweb-raw >/dev/null 2>&1 || gh release create fineweb-raw --title "FineWeb raw pages (encrypted)" --notes "age-encrypted; readable only with the private key" || true
          ls -la out/
          gh release upload fineweb-raw out/* --clobber
