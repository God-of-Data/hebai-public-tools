# GPU jobs on Modal. job=check: verifies the Modal token only. job=bino: Binoculars (modal_jobs/bino.py) on encrypted
# input from branch bino-input; the decryption key is passed for this run only; encrypted scores -> branch out-modal-bino.
name: Modal run
on:
  workflow_dispatch:
    inputs:
      job: {description: "check | bino | ft | linear", default: "check"}
      tag: {description: "ft: suffix for the weight file (e.g. v35)", default: ""}
      epochs: {description: "ft: epochs", default: "2"}
      limit: {description: "max texts (bino)", default: "5000"}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q modal
      - name: Check token
        run: |
          [ -n "$MODAL_TOKEN_ID" ] && echo "::notice::MODAL_TOKEN_ID present" || echo "::error::MODAL_TOKEN_ID missing"
          [ -n "$MODAL_TOKEN_SECRET" ] && echo "::notice::MODAL_TOKEN_SECRET present" || echo "::error::MODAL_TOKEN_SECRET missing"
          if modal app list > /tmp/a.txt 2>&1; then echo "::notice::Modal auth OK"; else echo "::error::Modal auth failed: $(head -c 200 /tmp/a.txt)"; exit 1; fi
      - name: Binoculars
        if: ${{ inputs.job == 'bino' }}
        env: {REQ_AGE_KEY: "${{ secrets.REQ_AGE_KEY }}"}
        run: |
          git fetch -q origin bino-input && git checkout FETCH_HEAD -- bino
          set -o pipefail
          modal run modal_jobs/bino.py --limit ${{ inputs.limit }} 2>&1 | tee /tmp/m.txt || { tail -c 1500 /tmp/m.txt | tr '\n' ' ' | sed 's/^/::error::/'; echo; exit 1; }
          grep -E "^texts|models loaded|saved" /tmp/m.txt | sed 's/^/::notice::/' || true
      - name: Save (encrypted)
        if: ${{ inputs.job == 'bino' && always() }}
        run: |
          git config user.name "gen-bot"; git config user.email "gen-bot@users.noreply.github.com"
          mkdir -p out; B="out-modal-bino"; git checkout --orphan "$B"; git rm -rf --cached . > /dev/null
          git add -f out; git commit --allow-empty -m "modal bino"; git push -f origin "$B"
      - name: Fine-tune on GPU (cv)
        if: ${{ inputs.job == 'ft' }}
        env: {REQ_AGE_KEY: "${{ secrets.REQ_AGE_KEY }}", GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          git fetch -q origin ft-input && git checkout FETCH_HEAD -- ft
          set -o pipefail
          modal run modal_jobs/ft.py --variant cv --epochs ${{ inputs.epochs }} 2>&1 | tee /tmp/m.txt || { tail -c 1500 /tmp/m.txt | tr '\n' ' ' | sed 's/^/::error::/'; echo; exit 1; }
          grep -E "::notice::|saved|device" /tmp/m.txt | sed 's/^::notice:://; s/^/::notice::/' || true
          T="${{ inputs.tag }}"; if [ -n "$T" ]; then for f in out_model/*.tar.gz.age; do mv "$f" "${f%.tar.gz.age}_$T.tar.gz.age"; done; fi
          gh release view ft-models >/dev/null 2>&1 || gh release create ft-models --title "Fine-tuned models (encrypted)" --notes "age-encrypted" || true
          gh release upload ft-models out_model/* --clobber
          git config user.name "gen-bot"; git config user.email "gen-bot@users.noreply.github.com"
          B="out-ft-cv-gpu"; git checkout --orphan "$B"; git rm -rf --cached . > /dev/null
          git add -f out; git commit --allow-empty -m "ft cv gpu $T"; git push -f origin "$B"
      - name: Linear fits in parallel (CPU)
        if: ${{ inputs.job == 'linear' }}
        env: {REQ_AGE_KEY: "${{ secrets.REQ_AGE_KEY }}"}
        run: |
          git fetch -q origin lin-input && git checkout FETCH_HEAD -- lin
          set -o pipefail
          modal run modal_jobs/linear.py 2>&1 | tee /tmp/m.txt || { tail -c 1500 /tmp/m.txt | tr '\n' ' ' | sed 's/^/::error::/'; echo; exit 1; }
          grep -E "^job |saved" /tmp/m.txt | sed 's/^/::notice::/' || true
          git config user.name "gen-bot"; git config user.email "gen-bot@users.noreply.github.com"
          B="out-modal-linear"; git checkout --orphan "$B"; git rm -rf --cached . > /dev/null
          git add -f out; git commit --allow-empty -m "modal linear"; git push -f origin "$B"
