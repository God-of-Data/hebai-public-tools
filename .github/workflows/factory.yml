# Family factory on Modal (Fable #22): one matrix job per open-weight family; encrypted answers -> branch out-factory-<family>.
name: Family factory
on:
  workflow_dispatch:
    inputs:
      families: {description: "JSON list", default: '["dictalm","llama","gemma","mistral","aya","phi"]'}
permissions: {contents: write}
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy: {fail-fast: false, matrix: {family: "${{ fromJSON(inputs.families) }}"}}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      REQ_AGE_KEY: ${{ secrets.REQ_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q modal
      - name: Generate
        run: |
          set -o pipefail
          modal run modal_jobs/factory.py --family ${{ matrix.family }} 2>&1 | tee /tmp/m.txt || { tail -c 1500 /tmp/m.txt | tr '\n' ' ' | sed 's/^/::error::/'; echo; exit 1; }
          grep -E "^requests|model loaded|generated|saved" /tmp/m.txt | sed 's/^/::notice::/' || true
      - name: Save (encrypted)
        if: always()
        run: |
          git config user.name "gen-bot"; git config user.email "gen-bot@users.noreply.github.com"
          mkdir -p out; B="out-factory-${{ matrix.family }}"; git checkout --orphan "$B"; git rm -rf --cached . > /dev/null
          git add -f out; git commit --allow-empty -m "factory ${{ matrix.family }}"; git push -f origin "$B"
