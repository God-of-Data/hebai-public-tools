# Daily Groq free-tier collection for the training requests. gpt-oss-120b allows 200,000 tokens per day (about
# 60-100 answers); the run stops when that limit is hit and the next day resumes where it stopped.
name: Groq daily

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch: {}

jobs:
  call:
    uses: ./.github/workflows/gen.yml
    with:
      provider: groq:openai/gpt-oss-120b
      requests: qa_pairs_test.txt.age   # train300 is covered (120b 0..96 + 20b 78..299)
    secrets: inherit
    permissions:
      contents: write
  qa_pairs_train:
    uses: ./.github/workflows/gen.yml
    with:
      provider: groq:openai/gpt-oss-20b
      requests: qa_pairs_train.txt.age
    secrets: inherit
    permissions:
      contents: write
  qa_pairs_test:
    needs: qa_pairs_train
    if: always()
    uses: ./.github/workflows/gen.yml
    with:
      provider: groq:openai/gpt-oss-20b
      requests: qa_pairs_test.txt.age
    secrets: inherit
    permissions:
      contents: write
