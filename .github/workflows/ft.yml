# Fine-tune DictaBERT-tiny (Fable #11, step 2). Encrypted inputs from branch ft-input; decrypted only inside the
# runner (secret REQ_AGE_KEY). Outputs (per-item probabilities) encrypted to recipient.txt on branch out-ft.
name: Fine-tune DictaBERT-tiny

on:
  workflow_dispatch:
    inputs:
      epochs: {description: "epochs", default: "2"}
      variants: {description: "JSON list of variants", default: '["full"]'}
      save_model: {description: "save encrypted weights to release ft-models", default: "1"}
      tag: {description: "suffix for the weight file names (keeps earlier weights)", default: ""}

permissions:
  contents: write

jobs:
  ft:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install transformers pyrage numpy
      - run: |
          git fetch -q origin ft-input && git checkout FETCH_HEAD -- ft
          mkdir -p out_model
          python ft_job.py --variant ${{ matrix.variant }} --epochs ${{ inputs.epochs }}
        env:
          REQ_AGE_KEY: ${{ secrets.REQ_AGE_KEY }}
          SAVE_MODEL: ${{ inputs.save_model == '1' && '1' || '' }}
      - name: Upload encrypted weights
        if: ${{ inputs.save_model == '1' }}
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          gh release view ft-models >/dev/null 2>&1 || gh release create ft-models --title "Fine-tuned models (encrypted)" --notes "age-encrypted" || true
          T="${{ inputs.tag }}"; if [ -n "$T" ]; then for f in out_model/*.tar.gz.age; do mv "$f" "${f%.tar.gz.age}_$T.tar.gz.age"; done; fi
          gh release upload ft-models out_model/* --clobber
      - name: Save
        if: always()
        run: |
          git config user.name "gen-bot"; git config user.email "gen-bot@users.noreply.github.com"
          mkdir -p out; B="out-ft-${{ matrix.variant }}"
          git checkout --orphan "$B"; git rm -rf --cached . > /dev/null; git add -f out
          git commit --allow-empty -m "ft ${{ matrix.variant }}"; git push -f origin "$B"
